name: heal-apply
on:
  issue_comment:
    types: [created]

# Runs from the DEFAULT branch's workflow file regardless of what the PR
# touched — a PR author cannot edit this file in their own PR to bypass the
# RBAC check below.
permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    concurrency:
      group: heal-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Verify commenter is a maintainer (RBAC — two layers)
        env:
          GH_TOKEN: ${{ github.token }}
          ASSOC: ${{ github.event.comment.author_association }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) echo "::error::author_association '$ASSOC' is not a maintainer — refusing."; exit 1 ;;
          esac
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" -q .permission)
          echo "Resolved permission for $ACTOR: $perm"
          if [ "$perm" != "admin" ] && [ "$perm" != "write" ]; then
            echo "::error::$ACTOR has permission '$perm' — refusing to apply."
            exit 1
          fi

      # Find the MOST RECENT healer proposal comment and check it hasn't
      # already been applied. Comments are never edited/overwritten in this
      # design (see heal-propose.yml) — every proposal is permanent history
      # — so "already applied?" has to be answered by searching for a later
      # resolution comment that names this proposal's comment id, not by
      # the proposal's own body having been mutated.
      - name: Find latest proposal + check idempotency
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            -q '[.[] | select(.body | contains("healer-bot:proposal"))] | sort_by(.created_at) | last' \
            > /tmp/proposal.json
          id=$(jq -r '.id // empty' /tmp/proposal.json)
          if [ -z "$id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "comment-id=$id" >> "$GITHUB_OUTPUT"
          jq -r '.body' /tmp/proposal.json > /tmp/proposal-body.txt

          already=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            -q "[.[] | select(.body | contains(\"resolves proposal #$id\"))] | length")
          echo "already-applied=$( [ "$already" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: No proposal found
        if: steps.find.outputs.found != 'true'
        run: gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "ℹ️ No healer proposal found on this PR to approve."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Already applied — refuse duplicate approval
        if: steps.find.outputs.found == 'true' && steps.find.outputs.already-applied == 'true'
        run: gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "ℹ️ Proposal #${{ steps.find.outputs.comment-id }} was already applied — this \`/approve\` is a no-op."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve PR head branch + sha
        id: pr
        if: steps.find.outputs.found == 'true' && steps.find.outputs.already-applied != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER" -q '.head.ref' > /tmp/ref
          gh api "repos/$REPO/pulls/$PR_NUMBER" -q '.head.sha' > /tmp/sha
          echo "ref=$(cat /tmp/ref)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat /tmp/sha)" >> "$GITHUB_OUTPUT"

      # Uses a PAT (HEALER_PAT), not the default GITHUB_TOKEN. If this push
      # authenticates as github-actions[bot] (the default token's identity),
      # GitHub attributes the resulting pull_request:synchronize event to
      # that bot actor — and, per a GitHub Actions security change rolled
      # out mid-2026, bot-triggered PR synchronize events on public repos
      # get gated behind manual "Approve workflows to run" even though the
      # human /approve already happened. A PAT from an actual maintainer
      # account makes the push (and the resulting re-run) attributable to a
      # trusted human, so it runs immediately like any other push would.
      - uses: actions/checkout@v4
        if: steps.find.outputs.found == 'true' && steps.find.outputs.already-applied != 'true'
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.HEALER_PAT }}

      - name: Extract state from the proposal comment
        id: state
        if: steps.find.outputs.found == 'true' && steps.find.outputs.already-applied != 'true'
        run: |
          node -e '
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/proposal-body.txt", "utf8");
            const m = body.match(/<!-- healer-state\n([\s\S]*?)\n-->/);
            if (!m) { console.error("No healer-state block found in proposal comment."); process.exit(1); }
            const state = JSON.parse(Buffer.from(m[1].trim(), "base64").toString("utf8"));
            fs.writeFileSync("candidate.diff", Buffer.from(state.diff, "utf8"));
            console.log("baseSha=" + state.baseSha);
          ' | tee /tmp/state.out
          grep "^baseSha=" /tmp/state.out >> "$GITHUB_OUTPUT"

      - name: Race check — has the branch moved since the proposal?
        id: race
        if: steps.find.outputs.found == 'true' && steps.find.outputs.already-applied != 'true'
        run: |
          current="${{ steps.pr.outputs.sha }}"
          expected="${{ steps.state.outputs.baseSha }}"
          echo "current=$current expected=$expected"
          if [ "$current" = "$expected" ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          elif git apply --3way --check candidate.diff 2>/dev/null; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Branch moved but patch still applies via 3-way merge."
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply + commit to the SAME PR branch
        if: steps.race.outputs.clean == 'true'
        run: |
          git apply --3way candidate.diff || git apply candidate.diff
          git config user.name 'healer-bot'
          git config user.email 'healer-bot@users.noreply.github.com'
          git commit -am "fix(test): apply approved heal [auto-healed against ${{ steps.state.outputs.baseSha }}]"
          git push origin HEAD:${{ steps.pr.outputs.ref }}

      - name: Record resolution — new comment, proposal above stays intact
        if: steps.race.outputs.clean == 'true'
        run: |
          gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "✅ Applied — approved by @${{ github.event.comment.user.login }}. resolves proposal #${{ steps.find.outputs.comment-id }} → commit \`$(git rev-parse HEAD)\`."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Refuse — branch changed and patch conflicts
        if: steps.race.outputs.clean == 'false'
        run: |
          gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "⚠️ This branch changed since proposal #${{ steps.find.outputs.comment-id }} was posted and the patch no longer applies cleanly. A fresh proposal will run on the next push."
        env:
          GH_TOKEN: ${{ github.token }}
